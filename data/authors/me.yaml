bio: |
  Kazuma Okada is a Postdoctoral Scholar in the Raul Andino Lab in the Department of
  Microbiology and Immunology at the University of California, San Francisco (UCSF).
  A virologist and veterinary scientist (DVM, PhD), he investigates poliovirus molecular
  biology and the rational design of next-generation vaccine strains, building on his
  research in enterovirus and human rhinovirus pathogenesis, reverse genetics, and RNA biology.
  Outside the lab, he is an avid marathon and trail [runner](/running/) (Marathon PB: 2:49:47).

